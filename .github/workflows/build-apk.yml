name: Build TrackMitra APK - F51 Mobile

on:
  push:
    branches: [ main, master, epic/test-free-v4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: npm install --legacy-peer-deps
      - run: npm install @tailwindcss/oxide-linux-x64-gnu --no-save || true
      - run: cp -f node_modules/@tailwindcss/oxide-linux-x64-gnu/tailwindcss-oxide.linux-x64-gnu.node node_modules/@tailwindcss/oxide/ 2>/dev/null || true
      - run: npm run build
      - run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TrackMitra-v4.2-F51-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
