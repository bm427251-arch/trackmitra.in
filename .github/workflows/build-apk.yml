name: Build TrackMitra APK - F51 Mobile

on:
  push:
    branches: [ main, master, epic/test-free-v4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npm i @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap init TrackMitra com.trackmitra.in --web-dir=dist
      - run: npx cap add android
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v3
        with:
          name: TrackMitra-v4.2-F51-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
